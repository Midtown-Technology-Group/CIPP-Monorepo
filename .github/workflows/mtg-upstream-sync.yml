name: "MTG: Synchronize Upstream"

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: mtg-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync conflict-free upstream releases
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward the pristine mirror from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
      - id: production
        name: Merge upstream into Midtown production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=mtg-production >"$response_file" 2>&1; then
            title="CIPP upstream synchronization needs operator attention"
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "$title in:title" --json number --jq '.[0].number // empty')
            body=$(printf 'GitHub could not merge the current upstream release into `mtg-production`. This normally means the Midtown patch stack conflicts with upstream.\n\nRun: %s\n\n```text\n%s\n```' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "$(head -c 4000 "$response_file")")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
            exit 1
          fi
          merge_type=$(jq -r '.merge_type' "$response_file")
          echo "merge_type=$merge_type" >> "$GITHUB_OUTPUT"
          jq . "$response_file"
      - name: Validate the updated production branch
        if: steps.production.outputs.merge_type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/mtg-production" --jq '.commit.sha')
          gh workflow run mtg-validate.yml --repo "$GITHUB_REPOSITORY" --ref mtg-production
          gh workflow run mtg-release-container.yml --repo "$GITHUB_REPOSITORY" --ref mtg-production -f source_sha="$source_sha"
