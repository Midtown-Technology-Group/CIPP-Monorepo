name: "MTG: Synchronize Upstream"

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mtg-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream and prepare reviewed production updates
    if: github.ref == 'refs/heads/mtg-production'
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward the pristine mirror from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a signed production update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main mtg-production
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/mtg-production)"
          python3 build/tools/mtg_upstream.py --publish "$GITHUB_REPOSITORY"
      - name: Report a stopped upstream conveyor
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="CIPP upstream synchronization needs operator attention"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body_file=$(mktemp)
          printf 'The upstream mirror or production PR preparation stopped. Production was not modified. Inspect this run before retrying; preserve any existing update branch or PR.\n\nRun: %s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$body_file"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
          fi
