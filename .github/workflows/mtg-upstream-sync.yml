name: "MTG: Synchronize Upstream"

on:
  schedule:
    - cron: "17 */6 * * *"
    # Publisher-only tick: dispatches builds for merged commits that have none.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: mtg-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream and prepare reviewed production updates
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    if: github.ref == 'refs/heads/mtg-production' && github.event.schedule != '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Require an unlocked mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A locked branch rejects the Actions token's fork sync with a generic
          # 409 "merge conflicts", so fail with the real cause instead.
          locked=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" --jq '.lock_branch.enabled // false' 2>/dev/null || echo false)
          if [ "$locked" = "true" ]; then
            echo "main is locked; GitHub's fork sync cannot update it with the Actions token. Unlock the branch, then retry." >&2
            exit 1
          fi
      - name: Fast-forward the pristine mirror from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a signed production update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main mtg-production
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/mtg-production)"
          python3 build/tools/mtg_upstream.py --publish "$GITHUB_REPOSITORY"
      - name: Report a stopped upstream conveyor
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="CIPP upstream synchronization needs operator attention"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body_file=$(mktemp)
          printf 'The upstream mirror or production PR preparation stopped. Production was not modified. Inspect this run before retrying; preserve any existing update branch or PR.\n\nRun: %s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$body_file"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
          fi
  publish:
    name: Publish a merged production commit with no candidate
    permissions:
      actions: write
      contents: read
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the missing validation and candidate build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Auto-merge runs as the Actions app, whose pushes do not trigger the
          # push-based validation or publish workflows, so dispatch them for the
          # merged commit.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/mtg-production" --jq '.commit.sha')
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Backend standards" or .name == "Frontend standards" or .name == "Container build")] | length')
          if [ "$checks" = "0" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/mtg-validate.yml/dispatches" -f ref=mtg-production
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/mtg-release-container.yml/runs?branch=mtg-production&head_sha=${head}&per_page=1" --jq '.workflow_runs | length')
          if [ "$existing" = "0" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/mtg-release-container.yml/dispatches" \
              -f ref=mtg-production -f "inputs[source_sha]=${head}"
          fi
